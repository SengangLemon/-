name: Fix Nonet runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-nonet-runtime.yml'

permissions:
  contents: write

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix browser global name collision
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          fixed = source.replace('function top(back)', 'function renderTopbar(back)')
          fixed = fixed.replace('${top()', '${renderTopbar()')
          fixed = fixed.replace('${top(', '${renderTopbar(')

          if fixed == source:
              print('No replacement was needed.')
          else:
              path.write_text(fixed, encoding='utf-8')
              print('Fixed the top/window.top collision.')
          PY

      - name: Commit the runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Nonet blank screen runtime error"
            git push
          fi
