const app=document.getElementById('app'),modal=document.getElementById('modal'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const PKEY='nonet:personal-v3';let state={personal:[]};try{state.personal=JSON.parse(localStorage.getItem(PKEY)||'[]')}catch{};if(!state.personal.length)migrate();function migrate(){try{let idx=JSON.parse(localStorage.getItem('nonet:boards-index')||'[]');state.personal=idx.map(b=>{let old={};try{old=JSON.parse(localStorage.getItem('nonet:board:'+b.id)||localStorage.getItem('board:'+b.id)||'{}')}catch{};let nodes={};Object.entries(old.nodes||{}).forEach(([k,v])=>nodes[k]={title:v.label||v.title||'',note:v.note||''});return{id:b.id,title:b.title||old.title||'이전 보드',mode:'free',nodes}});savePersonal()}catch{}}function savePersonal(){localStorage.setItem(PKEY,JSON.stringify(state.personal))}
function top(back){return`<div class="top">${back?`<button class="icon" data-go="${back}">←</button>`:''}<button class="brand" data-go="#/">Nonet<sup>9ⁿ</sup></button><span class="spacer"></span><button class="btn" data-search>검색</button></div>`}function go(h){location.hash=h}function route(){let p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);if(!p.length)return{n:'home'};if(p[0]==='course'){let c=COURSES.find(x=>x.id===p[1]);if(!c)return{n:'home'};if(!p[2])return{n:'course',c};let ch=c.chapters.find(x=>x.id===p[2]);if(!ch)return{n:'course',c};return{n:'chapter',c,ch,path:p.slice(3)}}if(p[0]==='personal'){let b=state.personal.find(x=>x.id===p[1]);return b?{n:'personal',b,path:p.slice(2).map(Number)}:{n:'home'}}return{n:'home'}}
function typeStyle(t){let a=TYPE[t]||TYPE.concept;return`--type:${a[1]};--typeSoft:${a[2]}`}function render(){let r=route();if(r.c)document.documentElement.style.setProperty('--accent',r.c.accent);else document.documentElement.style.setProperty('--accent','#2F5D62');if(r.n==='home')home();if(r.n==='course')course(r.c);if(r.n==='chapter')chapter(r);if(r.n==='personal')personal(r);bind()}
function home(){let courses=COURSES.map(c=>`<button class="course-card" style="--course:${c.accent}" data-go="#/course/${c.id}"><div class="eyebrow">COURSE · CHAPTER → 9ⁿ</div><h3>${c.title}</h3><p>${c.desc}</p><div class="chips"><span class="chip">${c.chapters.length} CHAPTERS</span><span class="chip">${c.chapters.reduce((n,x)=>n+x.concepts.length,0)} CORE CONCEPTS</span></div></button>`).join('');let personalCards=state.personal.map(b=>`<button class="personal-card" data-go="#/personal/${b.id}"><button class="del" data-del="${b.id}">✕</button><div class="eyebrow">${b.mode==='hub'?'HUB 9ⁿ':'FREE 9ⁿ'}</div><h3>${esc(b.title)}</h3><p>${b.mode==='hub'?'중앙 허브 + 주변 8개 가지':'기존 Nonet 방식의 자유 9칸'} · ${Object.keys(b.nodes||{}).length} nodes</p></button>`).join('');app.innerHTML=`${top()}<section class="hero"><div class="eyebrow">CHAPTER-FIRST KNOWLEDGE MAP</div><h1>순서와 깊이를 함께 복습하기</h1><p>과목은 챕터 축으로 진행하고, 각 챕터에서는 중앙 허브와 8개 핵심 개념이 펼쳐집니다. 개념을 누르면 정의·정리·증명·예제로 계속 내려갑니다. 개인 보드에도 같은 구조를 그대로 사용할 수 있습니다.</p><div class="actions"><button class="btn primary" data-go="#/course/la">선형대수 시작</button><button class="btn" data-go="#/course/ma">현대대수 시작</button><button class="btn" data-search>전체 검색</button></div></section><div class="section"><h2>학습 과목</h2><p>챕터 순서는 유지하고 개념은 9ⁿ으로 깊어집니다.</p></div><section class="course-grid">${courses}</section><div class="section"><h2>내 Nonet 보드</h2><p>원래 앱의 개인 보드 기능도 새 기본 틀로 업그레이드했습니다.</p></div><section class="personal-grid">${personalCards||'<div class="panel"><p class="summary">아직 개인 보드가 없습니다.</p></div>'}</section><div class="actions"><button class="btn primary" data-new="hub">+ 허브형 보드</button><button class="btn" data-new="free">+ 자유형 보드</button></div>`}
function course(c){let cards=c.chapters.map((ch,i)=>`<div class="step"><button class="chapter-card" data-go="#/course/${c.id}/${ch.id}"><small>CHAPTER ${String(ch.n).padStart(2,'0')}</small><h3>${ch.title}</h3><p>${ch.sub}</p></button>${i<c.chapters.length-1?'<i class="link"></i>':''}</div>`).join('');app.innerHTML=`${top('#/')}<section class="hero"><div class="eyebrow">${c.chapters.length} CHAPTERS</div><h1>${c.title}</h1><p>${c.desc} 중앙 축을 따라 챕터가 이어지고, 챕터를 열면 3×3 지식 지도가 펼쳐집니다.</p></section><div class="section"><h2>Chapter spine</h2><p>왼쪽에서 오른쪽으로 학습 순서를 유지합니다.</p></div><section class="spine">${cards}</section>`}
function getNode(ch,path){let nodes=ch.concepts,n=null;for(let id of path){n=nodes.find(x=>slug(x.title)===id);if(!n)return null;nodes=n.children||[]}return n}function slug(s){return encodeURIComponent(s.replaceAll('/','-'))}function chapter(r){let n=getNode(r.ch,r.path),children=n?(n.children||[]):r.ch.concepts;let title=n?n.title:`Chapter ${r.ch.n}`,summary=n?n.summary:r.ch.sub;let cells=Array(9).fill(null),pos=[0,1,2,3,5,6,7,8];children.slice(0,8).forEach((x,i)=>cells[pos[i]]=x);let tiles=cells.map((x,i)=>i===4?`<div class="tile center" style="${typeStyle(n?.type||'concept')}"><span class="badge">${n?TYPE[n.type]?.[0]||'개념':'CHAPTER'}</span><h3>${esc(title)}</h3></div>`:x?`<button class="tile" style="${typeStyle(x.type)}" data-child="${slug(x.title)}"><span class="badge">${TYPE[x.type]?.[0]||'개념'}</span><h3>${esc(x.title)}</h3></button>`:`<div class="tile empty"><h3>비어 있음</h3></div>`).join('');let back=r.path.length?`#/course/${r.c.id}/${r.ch.id}/${r.path.slice(0,-1).join('/')}`:`#/course/${r.c.id}`;let note=n?`${n.statement?`<div class="note theorem"><b>정리</b><p>${esc(n.statement)}</p></div>`:''}${n.proof?`<div class="note proof"><b>증명 포인트</b><p>${esc(n.proof)}</p></div>`:''}${n.example?`<div class="note"><b>예제</b><p>${esc(n.example)}</p></div>`:''}`:`<div class="note"><b>구조</b><p>중앙은 Chapter 허브, 주변 8칸은 핵심 개념입니다. 개념을 누르면 하위 정의·정리·증명·예제로 내려갑니다.</p></div>`;app.innerHTML=`${top(back)}<div class="crumbs"><button class="crumb" data-go="#/course/${r.c.id}">${r.c.short}</button><button class="crumb" data-go="#/course/${r.c.id}/${r.ch.id}">Ch.${r.ch.n} ${r.ch.title}</button>${r.path.map((x,i)=>`<button class="crumb" data-go="#/course/${r.c.id}/${r.ch.id}/${r.path.slice(0,i+1).join('/')}">${decodeURIComponent(x)}</button>`).join('')}</div><section class="study"><div><div class="viewport"><div class="grid">${tiles}</div></div></div><aside class="panel"><div class="eyebrow">${n?TYPE[n.type]?.[0]||'개념':'CHAPTER HUB'}</div><h2>${esc(title)}</h2><p class="summary">${esc(summary||'')}</p>${note}</aside></section>`}
function personal(r){let key=r.path.join(','),node=r.b.nodes?.[key]||null,children=Array(9).fill(null);for(let i=0;i<9;i++){let k=[...r.path,i].join(',');if(r.b.nodes?.[k])children[i]=r.b.nodes[k]}let center=r.b.mode==='hub'?4:-1;let tiles=children.map((x,i)=>i===center?`<div class="tile center"><span class="badge">HUB</span><h3>${esc(node?.title||r.b.title)}</h3></div>`:x?`<button class="tile" data-pchild="${i}"><span class="badge">NODE</span><h3>${esc(x.title||'이름 없음')}</h3></button>`:`<button class="tile empty" data-add="${i}"><h3>+ 추가</h3></button>`).join('');let back=r.path.length?`#/personal/${r.b.id}/${r.path.slice(0,-1).join('/')}`:'#/';app.innerHTML=`${top(back)}<section class="study"><div><div class="viewport"><div class="grid">${tiles}</div></div><p class="summary" style="font-size:11px;text-align:center">${r.b.mode==='hub'?'중앙 허브를 기준으로 주변 8개 가지':'현재 위치의 9칸을 자유롭게 사용'}</p></div><aside class="panel"><div class="eyebrow">PERSONAL · ${r.b.mode.toUpperCase()}</div><h2>${esc(node?.title||r.b.title)}</h2><div class="editor"><label>제목<input id="ptitle" value="${esc(node?.title|| (r.path.length?'':r.b.title))}"></label><label>노트<textarea id="pnote">${esc(node?.note||'')}</textarea></label></div><div class="actions"><button class="btn primary" data-psave>저장</button>${r.path.length?'<button class="btn" data-pdelete>이 가지 삭제</button>':''}</div></aside></section>`}
function bind(){app.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));app.querySelectorAll('[data-search]').forEach(x=>x.onclick=search);app.querySelectorAll('[data-new]').forEach(x=>x.onclick=()=>newBoard(x.dataset.new));app.querySelectorAll('[data-del]').forEach(x=>x.onclick=e=>{e.stopPropagation();if(confirm('이 보드를 삭제할까요?')){state.personal=state.personal.filter(b=>b.id!==x.dataset.del);savePersonal();render()}});let r=route();if(r.n==='chapter')app.querySelectorAll('[data-child]').forEach(x=>x.onclick=()=>go(`#/course/${r.c.id}/${r.ch.id}/${[...r.path,x.dataset.child].join('/')}`));if(r.n==='personal'){app.querySelectorAll('[data-pchild]').forEach(x=>x.onclick=()=>go(`#/personal/${r.b.id}/${[...r.path,x.dataset.pchild].join('/')}`));app.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{let i=+x.dataset.add,k=[...r.path,i].join(',');r.b.nodes=r.b.nodes||{};r.b.nodes[k]={title:'새 항목',note:''};savePersonal();go(`#/personal/${r.b.id}/${[...r.path,i].join('/')}`)});document.querySelector('[data-psave]')?.addEventListener('click',()=>{let k=r.path.join(','),title=document.querySelector('#ptitle').value.trim()||'이름 없음',note=document.querySelector('#pnote').value;if(r.path.length){r.b.nodes[k]={title,note}}else r.b.title=title;r.b.nodes[k]={...(r.b.nodes[k]||{}),title,note};savePersonal();render()});document.querySelector('[data-pdelete]')?.addEventListener('click',()=>{let p=r.path.join(',');Object.keys(r.b.nodes).filter(k=>k===p||k.startsWith(p+',')).forEach(k=>delete r.b.nodes[k]);savePersonal();go(r.path.length>1?`#/personal/${r.b.id}/${r.path.slice(0,-1).join('/')}`:`#/personal/${r.b.id}`)})}}
function newBoard(mode){let title=prompt('보드 제목','새 Nonet 보드');if(title==null)return;let id='p'+Date.now().toString(36);state.personal.push({id,title:title.trim()||'새 Nonet 보드',mode,nodes:{}});savePersonal();go(`#/personal/${id}`)}
function search(){let list=[];for(let c of COURSES)for(let ch of c.chapters)walk(c,ch,ch.concepts,[],list);modal.innerHTML=`<div class="modal"><section class="modalbox"><div class="top"><h2 style="font:600 24px Fraunces">개념 검색</h2><span class="spacer"></span><button class="icon" data-close>✕</button></div><input class="search" id="q" placeholder="기저, 스펙트럴 정리, 극대아이디얼…"><div class="results" id="res"></div></section></div>`;let q=document.querySelector('#q'),res=document.querySelector('#res');function upd(){let s=q.value.trim().toLowerCase();res.innerHTML=(s?list.filter(x=>x.text.includes(s)).slice(0,50):[]).map(x=>`<button class="result" data-r="${x.route}"><b>${esc(x.title)}</b><span>${x.course} · Ch.${x.ch}</span></button>`).join('')||'<p class="summary">개념어를 입력하세요.</p>';res.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{modal.innerHTML='';go(x.dataset.r)})}q.oninput=upd;document.querySelector('[data-close]').onclick=()=>modal.innerHTML='';q.focus()}function walk(c,ch,nodes,path,out){for(let n of nodes){let p=[...path,slug(n.title)];out.push({title:n.title,text:(n.title+' '+(n.summary||'')+' '+(n.statement||'')).toLowerCase(),course:c.short,ch:ch.n,route:`#/course/${c.id}/${ch.id}/${p.join('/')}`});if(n.children)walk(c,ch,n.children,p,out)}}
window.addEventListener('hashchange',render);if(!location.hash)location.hash='#/';render();
</script></body></html>
