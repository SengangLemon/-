function save(){localStorage.setItem(RKEY,JSON.stringify(review));localStorage.setItem(PKEY,JSON.stringify(personal))}function go(h){location.hash=h}function renderTopbar(back){return`<div class=top>${back?`<button class=icon data-go="${back}">←</button>`:''}<button class=brand data-go="#/">Nonet Study<sup>9ⁿ</sup></button><span class=sp></span><button class=btn data-due>복습</button><button class=btn data-search>검색</button></div>`}function route(){let p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);if(!p.length)return{v:'home'};if(p[0]==='course'){let c=COURSES.find(x=>x.id===p[1]);if(!c)return{v:'home'};if(!p[2])return{v:'course',c};let ch=c.chapters.find(x=>x.id===p[2]);if(!ch)return{v:'course',c};return{v:'chapter',c,ch,path:p.slice(3)}}if(p[0]==='personal'){let b=personal.find(x=>x.id===p[1]);return b?{v:'personal',b,path:p.slice(2).map(Number)}:{v:'home'}}return{v:'home'}}
function findNode(ch,path){let arr=ch.concepts,o=null;for(let s of path){o=arr.find(x=>slug(x.title)===s);if(!o)return null;arr=o.children||[]}return o}function nodeKey(c,ch,path){return`${c.id}/${ch.id}/${path.join('/')}`}function style(t){let a=T[t]||T.concept;return`--tc:${a[1]};--ts:${a[2]}`}function render(){let r=route();document.documentElement.style.setProperty('--acc',r.c?.accent||'#2f5d62');if(r.v==='home')home();if(r.v==='course')course(r.c);if(r.v==='chapter')chapter(r);if(r.v==='personal')personalView(r);bind()}
function home(){let due=Object.values(review).filter(x=>x.status==='again'||(x.due&&x.due<=Date.now())).length;app.innerHTML=`${renderTopbar()}<section class=hero><div class=kicker>INTEGRATED V4 · CHAPTER-FIRST 9ⁿ</div><h1>순서와 깊이를 함께 복습하기</h1><p>챕터 순서를 따라가되, 각 챕터에서는 중앙 허브와 8개 핵심 개념이 펼쳐집니다. 개념 아래에는 정의·정리·증명·예제·주의 노드가 이어집니다. 기존 Nonet 방식의 개인 보드도 함께 사용할 수 있습니다.</p><div class=actions><button class="btn primary" data-go="#/course/la">선형대수 시작</button><button class=btn data-go="#/course/ma">현대대수 시작</button><button class=btn data-due>복습 ${due?`(${due})`:''}</button></div></section><div class=section><h2>학습 과목</h2><p>과목 → 챕터 축 → 9ⁿ 개념 트리</p></div><section class=coursegrid>${COURSES.map(c=>`<button class="card course" style="--course:${c.accent}" data-go="#/course/${c.id}"><div class=kicker>COURSE · ${c.chapters.length} CHAPTERS</div><h3>${c.title}</h3><p>${c.desc}</p><div class=chips><span class=chip>${c.chapters.reduce((a,b)=>a+b.concepts.length,0)} CORE</span><span class=chip>ACTIVE RECALL</span></div></button>`).join('')}</section><div class=section><h2>내 Nonet 보드</h2><p>허브형 또는 기존 자유형 9칸</p></div><section class=personalgrid>${personal.map(b=>`<div class="card personal" data-go="#/personal/${b.id}"><button class=del data-del="${b.id}">✕</button><div class=kicker>${b.mode==='hub'?'HUB 9ⁿ':'FREE 9ⁿ'}</div><h3>${esc(b.title)}</h3><p>${Object.keys(b.nodes||{}).length} nodes</p></div>`).join('')||'<div class="card"><p>아직 개인 보드가 없습니다.</p></div>'}</section><div class=actions><button class="btn primary" data-new=hub>+ 허브형 보드</button><button class=btn data-new=free>+ 자유형 보드</button></div>`}
function course(c){app.innerHTML=`${renderTopbar('#/')}<section class=hero><div class=kicker>${c.chapters.length} CHAPTERS · CHAPTER SPINE</div><h1>${c.title}</h1><p>${c.desc}. 왼쪽에서 오른쪽으로 챕터 순서를 유지합니다.</p></section><div class=section><h2>Chapter spine</h2></div><section class=spine>${c.chapters.map((ch,i)=>`<div class=step><button class="card chapter" data-go="#/course/${c.id}/${ch.id}"><small>CHAPTER ${String(ch.no).padStart(2,'0')}</small><h3>${ch.title}</h3><p>${ch.sub}</p></button>${i<c.chapters.length-1?'<i class=connector></i>':''}</div>`).join('')}</section>`}
function chapter(r){let o=findNode(r.ch,r.path),kids=o?(o.children||[]):r.ch.concepts,title=o?o.title:`Chapter ${r.ch.no}`,sum=o?o.summary:r.ch.sub,cells=Array(9).fill(null),pos=[0,1,2,3,5,6,7,8];kids.slice(0,8).forEach((x,i)=>cells[pos[i]]=x);let key=nodeKey(r.c,r.ch,r.path),rv=review[key]||{};let tiles=cells.map((x,i)=>i===4?`<div class=\"tile center\" style=\"${style(o?.type||'concept')}\"><span class=badge>${o?(T[o.type]?.[0]||'개념'):'CHAPTER'}</span><h3>${esc(title)}</h3></div>`:x?`<button class=tile style=\"${style(x.type)}\" data-child=\"${slug(x.title)}\"><span class=badge>${T[x.type]?.[0]||'개념'}</span><h3>${esc(x.title)}</h3></button>`:`<div class=\"tile empty\"><h3>비어 있음</h3></div>`).join('');let back=r.path.length?`#/course/${r.c.id}/${r.ch.id}/${r.path.slice(0,-1).join('/')}`:`#/course/${r.c.id}`,notes=o?`${o.statement?`<div class=note><b>정리</b><p>${esc(o.statement)}</p></div>`:''}${o.proof?`<div class=\"note proof\"><b>증명 포인트</b><p>${esc(o.proof)}</p></div>`:''}${o.type==='warning'?`<div class=\"note warn\"><b>주의</b><p>${esc(o.summary)}</p></div>`:''}`:`<div class=note><b>구조</b><p>중앙은 챕터 허브, 주변 8칸은 핵심 개념입니다. 개념을 누르면 더 깊은 정의·정리·예제로 이동합니다.</p></div>`;let recall=o?.quiz?`<div class=recall><div class=q>${esc(o.quiz)}</div><button class=btn data-reveal>정답 보기</button><div class=answer>${esc(o.answer||'')}</div></div>`:'';app.innerHTML=`${renderTopbar(back)}<div class=crumbs><button class=crumb data-go="#/course/${r.c.id}">${r.c.short}</button><button class=crumb data-go="#/course/${r.c.id}/${r.ch.id}">Ch.${r.ch.no} ${r.ch.title}</button></div><section class=study><div><div class=viewport><div class=grid>${tiles}</div></div></div><aside class=panel><div class=kicker>${o?(T[o.type]?.[0]||'개념'):'CHAPTER HUB'}</div><h2>${esc(title)}</h2><p class=summary>${esc(sum||'')}</p>${notes}${recall}${o?`<div class=review><button data-status=again class="${rv.status==='again'?'on':''}">↺ 다시 보기</button><button data-status=known class="${rv.status==='known'?'on':''}">✓ 이해함</button></div>`:''}</aside></section>`}
function personalView(r){let k=r.path.join(','),cur=r.b.nodes[k]||null,cells=Array(9).fill(null);for(let i=0;i<9;i++){let q=[...r.path,i].join(',');if(r.b.nodes[q])cells[i]=r.b.nodes[q]}let hub=r.b.mode==='hub'?4:-1,tiles=cells.map((x,i)=>i===hub?`<div class="tile center"><span class=badge>HUB</span><h3>${esc(cur?.title||r.b.title)}</h3></div>`:x?`<button class=tile data-pchild=${i}><span class=badge>NODE</span><h3>${esc(x.title)}</h3></button>`:`<button class="tile empty" data-add=${i}><h3>+ 추가</h3></button>`).join(''),back=r.path.length?`#/personal/${r.b.id}/${r.path.slice(0,-1).join('/')}`:'#/';app.innerHTML=`${renderTopbar(back)}<section class=study><div><div class=viewport><div class=grid>${tiles}</div></div></div><aside class=panel><div class=kicker>PERSONAL · ${r.b.mode.toUpperCase()}</div><h2>${esc(cur?.title||r.b.title)}</h2><div class=editor><input id=pt value="${esc(cur?.title||(r.path.length?'':r.b.title))}" placeholder="제목"><textarea id=pn placeholder="노트">${esc(cur?.note||'')}</textarea></div><div class=actions><button class="btn primary" data-psave>저장</button></div></aside></section>`}
function bind(){app.querySelectorAll('[data-go]').forEach(x=>x.onclick=e=>{e.stopPropagation();go(x.dataset.go)});app.querySelectorAll('[data-search]').forEach(x=>x.onclick=search);app.querySelectorAll('[data-due]').forEach(x=>x.onclick=dueReview);app.querySelectorAll('[data-new]').forEach(x=>x.onclick=()=>newBoard(x.dataset.new));app.querySelectorAll('[data-del]').forEach(x=>x.onclick=e=>{e.stopPropagation();if(confirm('삭제할까요?')){personal=personal.filter(b=>b.id!==x.dataset.del);save();render()}});let r=route();if(r.v==='chapter'){app.querySelectorAll('[data-child]').forEach(x=>x.onclick=()=>go(`#/course/${r.c.id}/${r.ch.id}/${[...r.path,x.dataset.child].join('/')}`));app.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>{let k=nodeKey(r.c,r.ch,r.path),s=x.dataset.status;review[k]={status:s,due:s==='again'?Date.now()+86400000:Date.now()+7*86400000,route:location.hash,title:findNode(r.ch,r.path)?.title};save();render()});let z=app.querySelector('[data-reveal]');if(z)z.onclick=()=>{let a=app.querySelector('.answer');a.classList.toggle('show');z.textContent=a.classList.contains('show')?'정답 숨기기':'정답 보기'}}if(r.v==='personal'){app.querySelectorAll('[data-pchild]').forEach(x=>x.onclick=()=>go(`#/personal/${r.b.id}/${[...r.path,+x.dataset.pchild].join('/')}`));app.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{let p=[...r.path,+x.dataset.add],k=p.join(',');r.b.nodes[k]={title:'새 항목',note:''};save();go(`#/personal/${r.b.id}/${p.join('/')}`)});let s=app.querySelector('[data-psave]');if(s)s.onclick=()=>{let k=r.path.join(','),title=app.querySelector('#pt').value.trim()||'이름 없음',note=app.querySelector('#pn').value;if(r.path.length)r.b.nodes[k]={title,note};else{r.b.title=title;r.b.nodes[k]={title,note}}save();render()}}}
function newBoard(mode){let title=prompt('보드 제목','새 Nonet 보드');if(title===null)return;let id='p'+Date.now().toString(36);personal.push({id,title:title.trim()||'새 Nonet 보드',mode,nodes:{}});save();go(`#/personal/${id}`)}function walk(c,ch,nodes,path,out){for(let o of nodes){let p=[...path,slug(o.title)];out.push({title:o.title,text:(o.title+' '+(o.summary||'')+' '+(o.statement||'')).toLowerCase(),route:`#/course/${c.id}/${ch.id}/${p.join('/')}`,where:`${c.short} · Ch.${ch.no}`});if(o.children)walk(c,ch,o.children,p,out)}}function search(){let list=[];COURSES.forEach(c=>c.chapters.forEach(ch=>walk(c,ch,ch.concepts,[],list)));modal.innerHTML=`<div class=modal><section class=modalbox><div class=top><h2>개념 검색</h2><span class=sp></span><button class=icon data-close>✕</button></div><input class=search id=q placeholder="기저, 스펙트럴 정리, 극대아이디얼…"><div class=results id=res></div></section></div>`;let q=document.getElementById('q'),res=document.getElementById('res');q.oninput=()=>{let s=q.value.trim().toLowerCase(),a=s?list.filter(x=>x.text.includes(s)).slice(0,60):[];res.innerHTML=a.map((x,i)=>`<button class=result data-i=${i}><b>${esc(x.title)}</b><span>${x.where}</span></button>`).join('')||'<p class=summary>검색어를 입력하세요.</p>';res.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{modal.innerHTML='';go(a[+b.dataset.i].route)})};modal.querySelector('[data-close]').onclick=()=>modal.innerHTML='';q.focus()}function dueReview(){let a=Object.values(review).filter(x=>x.route&&(x.status==='again'||x.due<=Date.now()));if(!a.length){alert('지금 복습할 항목이 없습니다.');return}go(a[Math.floor(Math.random()*a.length)].route)}
window.addEventListener('hashchange',render);if(!location.hash)location.hash='#/';render();
</script></body></html>
